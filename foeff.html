<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1f2e"><link rel="icon" href="icon-192.png">
<title>FoEfficiency</title>
<style>
/* Gemeinsame Design-Tokens aller Seiten (index, foeff, city, notify, Powerlevel im Shadow-DOM).
   Farbrollen: Gold (--accent) = Primäraktion + Ergebniszahlen, Blau (--accent2) = Auswahl/Fokus,
   Rot (--danger) = Gefahr, Grün (--ok) = Erfolg. Themes über html[data-theme]: dark (Standard), amoled, light (js/theme.js). */
:root {
  --bg: #1a1f2e;
  --bg2: #141824;
  --panel: #232a3d;
  --panel2: #2a3350;
  --in: #10141f;
  --border: #333d54;
  --text: #e8e6df;
  --muted: #8a92a6;
  --accent: #d4a94b;
  --accent2: #6fa8dc;
  --on-accent: #10141f;
  --sel: #253048;
  --danger: #e07856;
  --danger2: #e07a7a;
  --ok: #7fc98f;
  --warn: #e08a5b;
  --overlay: #0009;
  --shadow: rgba(0, 0, 0, 0.4);
  --glow: rgba(212, 169, 75, 0.35);
  --glow2: rgba(111, 168, 220, 0.35);
  --tint: rgba(111, 168, 220, 0.08);
  --r: 10px;
  --r-s: 6px;
  --sp: 12px;
  --bar-h: 48px;
  --nav-h: 58px;
  --f-title: 1.1rem;
  --f-section: 0.95rem;
  --f-small: 0.8rem;
  color-scheme: dark;
}
:root[data-theme="amoled"] {
  --bg: #000;
  --bg2: #000;
  --panel: #0f121a;
  --panel2: #171c28;
  --in: #07090e;
  --border: #252c3d;
  --sel: #141c2e;
  --overlay: #000b;
}
:root[data-theme="light"] {
  --bg: #f3efe6;
  --bg2: #ebe6da;
  --panel: #fffdf8;
  --panel2: #f6f1e6;
  --in: #ffffff;
  --border: #d8d0bf;
  --text: #232733;
  --muted: #646b7c;
  --accent: #9a6b00;
  --accent2: #1f6aa8;
  --on-accent: #ffffff;
  --sel: #e3edf7;
  --danger: #c2410c;
  --danger2: #c0392b;
  --ok: #2e7d32;
  --warn: #b45309;
  --overlay: #0006;
  --shadow: rgba(60, 50, 20, 0.18);
  --glow: rgba(154, 107, 0, 0.3);
  --glow2: rgba(31, 106, 168, 0.3);
  --tint: rgba(31, 106, 168, 0.08);
  color-scheme: light;
}
/* Einheitliche Kopfzeile: Titel links, Sprach- und Theme-Knopf (fixiert) rechts */
.appbar,
header.appbar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--bar-h);
  padding: 6px 118px 6px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.appbar h1,
h1.appbar,
.appbar .ttl {
  margin: 0;
  padding: 0;
  font-size: var(--f-title);
  font-weight: 700;
  letter-spacing: 0.2px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.appbar h1::before,
h1.appbar::before,
.appbar .ttl::before {
  content: "";
  width: 4px;
  height: 1.1em;
  border-radius: 2px;
  background: var(--accent);
  flex: none;
}
/* Theme-Knopf (js/theme.js): links neben der Sprachwahl */
button.thmb {
  position: fixed;
  top: 8px;
  right: 74px;
  z-index: 30;
  width: 30px;
  height: 30px;
  margin: 0;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--in);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
}
button.thmb svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* Zahlen: gleich breite Ziffern, damit Spalten bündig bleiben */
.num,
.val,
.res,
td,
input[type="number"] {
  font-variant-numeric: tabular-nums;
}
/* Ergebniskarte: abgesetzt, große Zahl in Gold */
.result {
  background: linear-gradient(135deg, var(--panel2), var(--panel));
  border: 1px solid var(--accent);
  border-radius: var(--r);
  padding: 12px 14px;
  box-shadow: 0 2px 10px var(--shadow);
}
.result .big {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
/* Chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  margin: 0 4px 3px 0;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--in);
  color: var(--muted);
  font-size: 0.72rem;
  line-height: 1.5;
  white-space: nowrap;
}
.chip.ev {
  color: var(--accent2);
  border-color: var(--accent2);
}
.chip.sz {
  color: var(--text);
}
.chip.lt {
  color: var(--warn);
  border-color: var(--warn);
}
.chip.st {
  color: var(--accent);
  border-color: var(--accent);
}
.chip.on {
  background: var(--accent2);
  border-color: var(--accent2);
  color: var(--on-accent);
  font-weight: 600;
}
.chip.zero {
  opacity: 0.55;
}
h1.appbar {
  padding: 6px 118px 6px 14px;
  background: transparent;
  border: 0;
}
h1.appbar > span:last-child {
  margin-left: auto;
}
</style><script>
// Theme (dark / amoled / light) für alle Seiten: html[data-theme], Knopf neben der Sprachwahl, Sync über localStorage (`foeff:theme`, JSON wie `foeff:lang`).
(function () {
  var K = "foeff:theme",
    T = ["dark", "amoled", "light"],
    BAR = { dark: "#1a1f2e", amoled: "#000000", light: "#f3efe6" },
    N = {
      en: { dark: "Dark", amoled: "AMOLED black", light: "Light", t: "Theme" },
      de: { dark: "Dunkel", amoled: "AMOLED-Schwarz", light: "Hell", t: "Design" },
    },
    I = {
      dark: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
      amoled:
        '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
      light:
        '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    };
  function get() {
    try {
      var v = JSON.parse(localStorage.getItem(K));
      return T.indexOf(v) < 0 ? "dark" : v;
    } catch (e) {
      return "dark";
    }
  }
  function lang() {
    try {
      return JSON.parse(localStorage.getItem("foeff:lang")) === "de" ? "de" : "en";
    } catch (e) {
      return "en";
    }
  }
  function apply() {
    var t = get();
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", BAR[t]);
    var b = document.getElementById("thmb");
    if (b) {
      var n = N[lang()];
      b.innerHTML = I[t];
      b.title = n.t + ": " + n[t];
      b.setAttribute("aria-label", b.title);
    }
  }
  apply();
  document.addEventListener("change", function (e) {
    if (e.target && /^(lgSel|lgs|lg)$/.test(e.target.id)) setTimeout(apply, 0);
  });
  window.addEventListener("storage", function (e) {
    if (e.key === K || e.key === "foeff:lang" || e.key === null) apply();
  });
  document.addEventListener("DOMContentLoaded", function () {
    var b = document.createElement("button");
    b.type = "button";
    b.id = "thmb";
    b.className = "thmb";
    b.addEventListener("click", function () {
      var t = T[(T.indexOf(get()) + 1) % T.length];
      try {
        localStorage.setItem(K, JSON.stringify(t));
      } catch (e) {
        /* ohne Speicher: nur diese Sitzung */
      }
      document.documentElement.setAttribute("data-theme", t);
      apply();
    });
    document.body.appendChild(b);
    apply();
  });
})();
</script><style>
:root {
  --t: var(--text);
  --c: var(--panel);
  --m: var(--muted);
  --a: var(--accent);
  --a2: var(--accent2);
  --b: var(--border);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: linear-gradient(160deg, var(--bg), var(--bg2)) fixed;

}

}

  padding: 8px 10px;
}

}
nav button.on {
  background: var(--a2);
  color: var(--on-accent);

}

  max-width: 900px;

}

  background: var(--in);

}

}
.pos {
  color: #7fc79a;
}
.neg {

}
h2 {
  font-size: 1rem;

}

}

}
.card.sel {

}
.pick {

  -webkit-tap-highlight-color: transparent;
}
.chip {
  display: inline-block;
  font-size: 11px;

/* Kit-Farben: normal weiß, Silver silber, Golden gold */
.m.kw,
.kw {
  color: #fff;
}
.m.ks,
.ks {
  color: #c0c0c0;
}
.m.kg,
.kg {
  color: #f1c232;
}
header h1 button.pk {
  font-weight: 400;
  letter-spacing: 0;
}

/* Animationen (werden bei „Bewegung reduzieren“ des Systems abgeschaltet) */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: no-preference) {
  button,
  select,
  input,
  .group-chip {
    transition:
      transform 0.12s ease,
      background-color 0.2s ease,
      border-color 0.2s ease,
      color 0.2s ease,
      box-shadow 0.2s ease,
      opacity 0.2s ease;
  }
  button:active {
    transform: scale(0.96);
  }
  input:focus,
  select:focus {
    box-shadow: 0 0 0 2px var(--glow);
  }
  #l > *,
  #o > * {
    animation: fadeUp 0.28s ease both;
  }
  #o > *:nth-child(2) {
    animation-delay: 0.05s;
  }
  #o > *:nth-child(3) {
    animation-delay: 0.1s;
  }
  nav button.on {
    animation: popIn 0.25s ease both;
  }
  .pk-sheet,
  .pk-box {
    animation: popIn 0.22s ease both;
  }
}
.lgt-scroll {
  overflow: auto;

}
.lgt {

}
.lgt th,
.lgt td {
  padding: 5px 9px;
  border-bottom: 1px solid var(--b);

}
.lgt th {
  position: sticky;
  top: 0;
  background: var(--c);
  color: var(--a);
  z-index: 1;
}
.lgt th:first-child,
.lgt td:first-child {
  position: sticky;
  left: 0;
  background: var(--c);

}
.lgt tr:hover td {
  background: var(--tint);
}

.bimg:empty {
  display: none;
}
.bimg {
  display: flex;

  margin: 8px -14px;
  padding: 10px 0;
  background: var(--card2, rgba(255, 255, 255, 0.05));
}
.bimg img {
  max-width: 85%;
  max-height: 240px;
  object-fit: contain;
}

// Deutsche Item-Namen (Englisch -> Deutsch): ITM (data/ITM.js), ITX (i18n/items.js) + Regeln für Kits, Einheiten, Boosts.
// Gemeinsam genutzt von foeff.html und city.html. Liefert itd(englischerName) -> deutscher Name oder null.
const ITX = I18N.items.ITX;
function itd(k) {
  if (ITM[k]) return ITM[k];
  if (ITX[k]) return ITX[k];
  let x;
  if ((x = /^(.*?)(?:(Golden|Silver|Platinum) )?(Selection|Upgrade) Kit$/.exec(k))) {
    const m = { Golden: "Gold-", Silver: "Silber-", Platinum: "Platin-" };
    return x[1] + (x[2] ? m[x[2]] : "") + (x[3] === "Selection" ? "Auswahl-Kit" : "Upgrade-Kit");
  }
  if ((x = /^\[Unit Type( NextEra)?\] (.+)$/.exec(k)))
    return (
      "Einheit: " +
      ({
        Fast: "Schnell",
        Heavy: "Schwer",
        Light: "Leicht",
        Artillery: "Artillerie",
        Ranged: "Fernkämpfer",
        Random: "Zufällig",
        Champion: "Held",
        "Color Guard": "Fahnenwache",
        "Military Drummer": "Militär-Trommler",
        Rogue: "Agent",
      }[x[2]] || x[2]) +

    ($("#kq").oninput = (e) => {
      kq = e.target.value;
      clearTimeout(kqT);
      kqT = setTimeout(kitList, 120);
    }),
    kitList());
}
</script><script>
// Tabs „LG-Stufe“ (vLg: ein LG auf einer Stufe) und „LG-Tabelle“ (vLgt: alle Stufen eines LGs): FP-Kosten, Zusatzkosten, Effekte
// Daten: DATA.jLGC (aus tools/gen_jlgc.js), Effekte: DATA.jLGV/jLGI. Ladereihenfolge: siehe <script>-Tags in foeff.html.
const LGC = DATA.jLGC,
  LGXF = ["cs", "gs", "c", "su", "me", "go"],
  lgName = (a) => (LG == "en" && LGC.NE[a]) || trn(LGC.NM[a] || a),
  lgSheet = (a) => Object.keys(CA).find((k) => CA[k] == a),
  lgMax = (a) => LGC.N[a][0],
  lgEffTab = (a) => {
    const k = lgSheet(a);
    return (k && (DATA.jLGV[k] || DATA.jLGI[k])) || null;
  };
// Kosten je Stufe (FP) für ein LG: Index = Stufe
function lgCosts(a) {
  const [m, ...st] = LGC.N[a],
    c = [0];
  let t = 0;
  for (let L = 1; L <= m; L++)
    c.push((t += st[L <= 10 ? 0 : L <= 40 ? 1 : L <= 70 ? 2 : L <= 100 ? 3 : L === 101 ? 4 : 5]));
  return c;
}
function lgExtraAt(a, L) {
  const m = LGC.M[a] || {},
    g = (k) => (m[k] && LGC.S[m[k]][L - 1]) || 0,
    co = g("co");
  return { cs: g("cs"), gs: g("gs"), c: co || g("c"), su: co || g("su"), me: g("me"), go: g("go") };
}
const lgOpts = (sel) =>
  LGC.O.filter((a) => LGC.N[a])
    .map((a) => `<option value="${a}"${a == sel ? " selected" : ""}>${esc(lgName(a))}</option>`)
    .join("");
const lgEffRow = (a, L) => {
  const V = lgEffTab(a);
  if (!V) return null;
  const row = V.v[Math.min(L, V.v.length) - 1];
  return V.i.map((q, j) => [q, row[j]]).filter((x) => x[1]);
};
let lgSel = ls("lgSel", "AD"),
  lgLv = ls("lgLv", 100);
function vLg() {
  LGC.N[lgSel] || (lgSel = "AD");
  setHtml(
    $("#v"),
    `<select id="lgx">${lgOpts(lgSel)}</select><div class="g"><span>${tl("f.lg.level")}</span><input id="lgl" type="number" min="1" value="${lgLv}"></div><div id="o"></div>`,
  );
  const go = () => {
    lgSel = $("#lgx").value;
    const m = lgMax(lgSel);
    lgLv = Math.max(1, Math.min(m, Math.round(+$("#lgl").value || 1)));
    sv("lgSel", lgSel);
    sv("lgLv", lgLv);
    const c = lgCosts(lgSel),
      x1 = lgExtraAt(lgSel, lgLv),
      ef = lgEffRow(lgSel, lgLv);
    let tw = 0;
    const er = (ef || [])
      .map(([q, v]) => {
        const w = W[q] || 0;
        tw += v * w;
        return `<div class="row"><span>${esc(trn(D.labels[q]))}</span><span>${fmt(v, 4)} <span class="m">× ${fmt(w, 4)} = ${fmt(v * w)}</span></span></div>`;
      })
      .join("");
    setHtml(
      $("#o"),
      `<div class="card"><b>${esc(lgName(lgSel))} · ${tl("f.lg.levelN", { n: lgLv })}</b><div class="row"><span>${tl("f.lg.cost")}</span><span>${fmt(c[lgLv], 0)} FP</span></div></div>` +
        `<div class="card"><b>${tl("f.lg.extra")}</b>${LGXF.map((k) => `<div class="row"><span>${tl("f.lg." + k)}</span><span>${x1[k] ? fmt(x1[k], 0) : "–"}</span></div>`).join("")}</div>` +
        `<div class="card"><b>${tl("f.lg.effects")}${ef && ef.length ? ` <span class="m">· ${tl("f.lg.weighted")}: ${fmt(tw)}</span>` : ""}</b>${er || `<div class="m">${tl("f.lg.noEff")}</div>`}</div>`,
    );
  };
  $("#lgx").onchange = go;
  $("#lgl").oninput = go;
  go();
}
function vLgt() {
  LGC.N[lgSel] || (lgSel = "AD");
  setHtml($("#v"), `<select id="lgx">${lgOpts(lgSel)}</select><div id="o"></div>`);
  const go = () => {
    lgSel = $("#lgx").value;
    sv("lgSel", lgSel);
    const m = lgMax(lgSel),
      c = lgCosts(lgSel),
      V = lgEffTab(lgSel),
      idx = V ? V.i : [];
    const head = `<tr><th>${tl("f.lg.lv")}</th><th>FP</th>${LGXF.map((k) => `<th>${tl("f.lg." + k)}</th>`).join("")}${idx.map((q) => `<th>${esc(trn(D.labels[q]))}</th>`).join("")}</tr>`,
      body = [];
    for (let L = 1; L <= m; L++) {
      const x = lgExtraAt(lgSel, L),
        r = V ? V.v[Math.min(L, V.v.length) - 1] : [];
      body.push(
        `<tr><td>${L}</td><td>${fmt(c[L], 0)}</td>${LGXF.map((k) => `<td>${x[k] ? fmt(x[k], 0) : ""}</td>`).join("")}${idx.map((q, j) => `<td>${r[j] ? fmt(r[j], 4) : ""}</td>`).join("")}</tr>`,
      );
    }
    setHtml(
      $("#o"),
      `<div class="card" style="padding:0"><div class="lgt-scroll"><table class="lgt">${head}${body.join("")}</table></div></div>`,
    );
  };
  $("#lgx").onchange = go;
  go();
}
</script><script>
// Tab „GG-Prüfung“ (vTr, cTr) und Start-Aufruf draw()
// Teil 8/8 von foeff-app.js (früher eine Datei); Ladereihenfolge: siehe <script>-Tags in foeff.html.
let kk = ls("kk", 16789);
function vTr() {
  (setHtml(
    $("#v"),
    `<div class="g"><span>${tl("f.combatPower")}</span><input id="k" type="number" value="${kk}"></div><div id="o"></div>`,
  ),
    ($("#v").oninput = cTr),
    cTr());
}
const TC = {
  s: ["f.coin.s", "#B7B7B7"],
  g: ["f.coin.g", "#F1C232"],
  p: ["f.coin.p", "#8E7CC3"],
  r: ["f.coin.r", "#38761D"],
};
function trLine(e, t, n) {
  const c = t.length,
    d = Math.max(...t.flatMap((u) => n.map((w) => u[w])), 1e-9),
    f = (u) => 46 + (286 * u) / (c - 1),
    m = (u) => 166 - (156 * u) / d,
    j = [0, 0.25, 0.5, 0.75, 1]
      .map((u) => {
        const w = m(d * u);
        return `<line x1="46" x2="332" y1="${w}" y2="${w}" stroke="var(--b)"/><text x="42" y="${w + 3}" text-anchor="end" font-size="9" fill="var(--m)">${fmt(d * u, d < 10 ? 2 : 0)}</text>`;
      })
      .join(""),
    M = t
      .map((u, w) =>
        u.id % 5 == 0 || w == 0
          ? `<text x="${f(w)}" y="181" text-anchor="middle" font-size="9" fill="var(--m)">${u.id}</text>`
          : "",
      )
      .join(""),
    G = n
      .map(
        (u) =>
          `<polyline fill="none" stroke="${TC[u[0]][1]}" stroke-width="2" stroke-linejoin="round" points="${t.map((w, y) => f(y).toFixed(1) + "," + m(w[u]).toFixed(1)).join(" ")}"/>`,
      )
      .join(""),
    S = t
      .map(
        (u, w) =>
          `<rect x="${f(w) - 294 / c / 2}" y="10" width="${294 / c}" height="156" fill="transparent"><title>Trial ${u.id}: ${n.map((y) => tl(TC[y[0]][0]) + " " + fmt(u[y], 2)).join(" · ")}</title></rect>`,
      )
      .join(""),
    _ = n
      .map(
        (u) =>
          `<span><span style="display:inline-block;width:14px;height:3px;background:${TC[u[0]][1]};vertical-align:middle;margin-right:4px"></span>${tl(TC[u[0]][0])}</span>`,
      )
      .join("");
  return `<div class="card"><div class="row" style="justify-content:flex-start;gap:12px;flex-wrap:wrap"><b>${e}</b></div><div class="m" style="display:flex;gap:12px;margin:4px 0">${_}</div><svg viewBox="0 0 340 190" width="100%" role="img" aria-label="${e}">${j}${G}${M}${S}</svg><div class="m" style="text-align:center">Trial</div></div>`;
}
function cTr() {
  ((kk = +$("#k").value || 0), sv("kk", kk));
  const e = D.att.slice(0, 151),
    t = A.t.map((s) => {
      const [a, i, o, l, , c, d, f, m, j, M, G, S] = [
        s[0],
        s[1],
        s[2],
        s[3],
        s[4],
        s[5],
        s[6],
        s[7],
        s[8],
        s[9],
        s[10],
        s[11],
        s[12],
      ];
      let _ = 1e18,
        u = 0;
      e.forEach(([y, r]) => {
        const p = Math.abs(r * o + i * (1 + l * 1.5) - kk);
        p < _ && ((_ = p), (u = y));
      });
      const w = u * 5;
      return {
        id: a,
        q: u,
        bt: w,
        s: d * f * m * w,
        g: d * j * M * w,
        p: d * G * S * w,
        r: w * c * 550 * 8,
        s1: d * f * m,
        g1: d * j * M,
        p1: d * G * S,
      };
    }),
    n = (s) => t.reduce((a, i) => (i[s] > a[s] ? i : a));
  setHtml(
    $("#o"),
    `<h2>${tl("f.coinsDayPower")}</h2>${trLine(tl("f.bgCoinsDay"), t, ["s", "g", "p"])}<h2>${tl("f.coinsEnc")}</h2>${trLine(tl("f.bgCoinsEnc"), t, ["s1", "g1", "p1"])}<h2>${tl("f.rpDay")}</h2>${trLine(tl("f.rpDay"), t, ["r"])}<h2>${tl("f.bestTrials")}</h2><div class="card">` +
      [
        [tl("f.coin.s"), "s"],
        [tl("f.coin.g"), "g"],
        [tl("f.coin.p"), "p"],
        [tl("f.coin.r"), "r"],
      ]
        .map(([s, a]) => {
          const i = n(a);
          return `<div class="row"><span>${s}</span><b>Trial ${i.id} · ${fmt(i[a], 0)}</b></div>`;
        })
        .join("") +
      `</div><h2>${tl("f.allTrials")}</h2>` +
      t
        .map(
          (s) =>
            `<div class="card"><div class="row"><b>Trial ${s.id}</b><span class="m">Attrition ${s.q} · ${tl("f.battles", { n: s.bt })}</span></div><div class="m">${tl("f.coin.s")} ${fmt(s.s, 0)} · ${tl("f.coin.g")} ${fmt(s.g, 0)} · ${tl("f.coin.p")} ${fmt(s.p, 0)} · RP ${fmt(s.r, 0)}</div></div>`,
        )
        .join(""),
  );
}
draw();
</script>
